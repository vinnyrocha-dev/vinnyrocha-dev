<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Obrigado pela visita">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a33"/>
      <stop offset="0.5" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e3a4a"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="180" rx="14"/></clipPath>
    <clipPath id="digita">
      <rect x="266" y="60" width="0" height="60">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0.0;12.0;24.0;36.0;48.0;60.0;72.0;84.0;96.0;108.0;120.0;132.0;144.0;156.0;168.0;180.0;192.0;204.0;216.0;228.0;240.0;252.0;264.0;276.0;288.0;300.0;312.0;324.0;336.0;348.0;360.0;372.0;384.0;396.0;408.0;420.0;432.0;444.0;456.0;468.0;468;409.5;351.0;292.5;234.0;175.5;117.0;58.5;0.0;0" keyTimes="0.0;0.0487;0.0574;0.0662;0.0749;0.0836;0.0923;0.101;0.1097;0.1185;0.1272;0.1359;0.1446;0.1533;0.1621;0.1708;0.1795;0.1882;0.1969;0.2056;0.2144;0.2231;0.2318;0.2405;0.2492;0.2579;0.2667;0.2754;0.2841;0.2928;0.3015;0.3103;0.319;0.3277;0.3364;0.3451;0.3538;0.3626;0.3713;0.38;0.74;0.755;0.77;0.785;0.8;0.815;0.83;0.845;0.86;1"/>
      </rect>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
      .onda1 { animation: anda 9s linear infinite; }
      .onda2 { animation: anda 14s linear infinite reverse; }
      @keyframes anda { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
      .pulsa { animation: pulsa 5s ease-in-out infinite; }
      @keyframes pulsa { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .p { opacity: 0; animation: flutua 7s linear infinite; }
      @keyframes flutua {
        0%   { opacity: 0; transform: translateY(0); }
        15%  { opacity: 0.8; }
        80%  { opacity: 0.4; }
        100% { opacity: 0; transform: translateY(-120px); }
      }
      .s { opacity: 0; animation: simbolo 11s ease-in-out infinite; }
      @keyframes simbolo {
        0%   { opacity: 0; transform: translateY(15px); }
        20%  { opacity: 0.35; }
        80%  { opacity: 0.35; }
        100% { opacity: 0; transform: translateY(-40px); }
      }
      .cursor { animation: pisca 1s steps(1) infinite; }
      @keyframes pisca { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="180" fill="url(#bg)"/>
    <rect width="1000" height="180" fill="url(#dots)" opacity="0.6"/>
    <rect class="pulsa" width="1000" height="180" fill="url(#glow)"/>

    <!-- ondas no topo (espelhando o banner) -->
    <g class="onda2" opacity="0.35">
      <path fill="#3b82f6" d="M0 0 H2000 V32 Q1875 52 1750 32 T1500 32 T1250 32 T1000 32 T750 32 T500 32 T250 32 T0 32 Z"/>
    </g>
    <g class="onda1" opacity="0.55">
      <path fill="url(#onda)" d="M0 0 H2000 V22 Q1875 38 1750 22 T1500 22 T1250 22 T1000 22 T750 22 T500 22 T250 22 T0 22 Z"/>
    </g>

    <!-- símbolos de código nas laterais -->
    <g class="mono" font-weight="700" fill="#22d3ee">
      <text class="s" x="60"  y="150" font-size="24" style="animation-delay:0s">{ }</text>
      <text class="s" x="140" y="110" font-size="18" style="animation-delay:4s">return;</text>
      <text class="s" x="870" y="150" font-size="24" style="animation-delay:2s">&lt;/&gt;</text>
      <text class="s" x="745" y="100" font-size="18" style="animation-delay:6.5s">git push</text>
    </g>

    <!-- partículas subindo -->
    <g fill="#67e8f9">
      <circle class="p" cx="90"  cy="175" r="2"   style="animation-delay:0s"/>
      <circle class="p" cx="230" cy="178" r="1.5" style="animation-delay:1.4s"/>
      <circle class="p" cx="380" cy="172" r="2"   style="animation-delay:3.2s"/>
      <circle class="p" cx="520" cy="178" r="1.5" style="animation-delay:5.1s"/>
      <circle class="p" cx="650" cy="174" r="2.5" style="animation-delay:2.3s"/>
      <circle class="p" cx="770" cy="178" r="1.5" style="animation-delay:4.6s"/>
      <circle class="p" cx="920" cy="173" r="2"   style="animation-delay:0.9s"/>
    </g>

    <!-- comando sendo digitado, apagado e digitado de novo -->
    <g clip-path="url(#digita)">
      <text class="mono" x="266" y="103" font-size="20" textLength="468" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">$ <tspan fill="#e2e8f0">git commit -m</tspan> <tspan fill="#67e8f9">"obrigado pela visita!"</tspan></text>
    </g>
    <rect class="cursor" x="266" y="86" width="11" height="22" fill="#22d3ee">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" calcMode="discrete" values="268.0;280.0;292.0;304.0;316.0;328.0;340.0;352.0;364.0;376.0;388.0;400.0;412.0;424.0;436.0;448.0;460.0;472.0;484.0;496.0;508.0;520.0;532.0;544.0;556.0;568.0;580.0;592.0;604.0;616.0;628.0;640.0;652.0;664.0;676.0;688.0;700.0;712.0;724.0;736.0;736;677.5;619.0;560.5;502.0;443.5;385.0;326.5;268.0;268" keyTimes="0.0;0.0487;0.0574;0.0662;0.0749;0.0836;0.0923;0.101;0.1097;0.1185;0.1272;0.1359;0.1446;0.1533;0.1621;0.1708;0.1795;0.1882;0.1969;0.2056;0.2144;0.2231;0.2318;0.2405;0.2492;0.2579;0.2667;0.2754;0.2841;0.2928;0.3015;0.3103;0.319;0.3277;0.3364;0.3451;0.3538;0.3626;0.3713;0.38;0.74;0.755;0.77;0.785;0.8;0.815;0.83;0.845;0.86;1"/>
    </rect>

    <!-- comentário que aparece quando o comando termina -->
    <text class="mono" x="500" y="140" text-anchor="middle" font-size="14" fill="#64748b" opacity="0">// até a próxima. bora codar!
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.38;0.43;0.72;0.78;1"/>
    </text>
  </g>
</svg>
