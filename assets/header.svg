<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Vinicius Rocha Pacheco, Desenvolvedor Back-End Java em formação">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0a2a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e3a4a"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sobe {
        opacity: 0;
        transform-box: fill-box;
        animation: sobe 0.9s cubic-bezier(.2,.7,.2,1) forwards;
      }
      .d0 { animation-delay: 0s; }
      .d1 { animation-delay: 0.25s; }
      .d2 { animation-delay: 0.5s; }
      .d3 { animation-delay: 0.75s; }
      .d4 { animation-delay: 1.15s; }
      .d5 { animation-delay: 1.55s; }
      .brace { opacity: 0; animation: aparece 1.6s ease forwards 0.3s; }
      .bar {
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
        animation: cresce 1s cubic-bezier(.2,.7,.2,1) forwards 1s;
      }
      .cursor { animation: pisca 1s steps(1) infinite; }
      @keyframes sobe {
        from { opacity: 0; transform: translateY(26px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes aparece { to { opacity: 1; } }
      @keyframes cresce { to { transform: scaleX(1); } }
      @keyframes pisca { 50% { fill-opacity: 0; } }
      .nome { font: 700 46px Arial, Helvetica, "Liberation Sans", sans-serif; fill: #f1f5f9; }
      .sans { font-family: Arial, Helvetica, "Liberation Sans", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect width="1000" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="14" fill="url(#dots)" opacity="0.6"/>
  <rect width="1000" height="240" rx="14" fill="url(#glow)"/>

  <!-- chaves decorativas -->
  <text class="brace mono" x="940" y="178" text-anchor="end" font-size="150" font-weight="700" fill="#22d3ee" fill-opacity="0.12">{ }</text>

  <!-- prompt -->
  <text class="sobe d0 mono" x="60" y="52" font-size="15" fill="#22d3ee">~/vinnyrocha-dev <tspan fill="#64748b">$ whoami</tspan></text>

  <!-- nome: cada palavra aparece e sobe -->
  <text class="nome sobe d1" x="60" y="115">Vinicius</text>
  <text class="nome sobe d2" x="250" y="115">Rocha</text>
  <text class="nome sobe d3" x="405" y="115">Pacheco</text>

  <rect class="bar" x="60" y="134" width="534" height="4" rx="2" fill="url(#accent)"/>

  <text class="sobe d4 sans" x="60" y="172" font-size="21" fill="#cbd5e1">Desenvolvedor Back-End Java em formação</text>

  <text class="sobe d5 mono" x="60" y="207" font-size="15" fill="#67e8f9">Java · Spring Boot · PostgreSQL · APIs REST</text>
</svg>
